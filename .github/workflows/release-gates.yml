name: Release gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - run: npm run build
        env:
          REACT_APP_BASE_URL: https://api.invalid.example/api/v1
          REACT_APP_SOCKET_URL: https://api.invalid.example
          REACT_APP_PUBLIC_SITE_URL: https://app.invalid.example
          REACT_APP_SHARE_BASE_URL: https://api.invalid.example
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./client/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend tests and syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/tipsyverse_integration
      - run: npm run check

  backend-image:
    name: Backend container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: tipsyverse-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
